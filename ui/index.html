<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图片转 SVG（网页版）</title>
<style>
  :root{
    --ink:#1c1c22; --muted:#6f7079; --line:#e2e2ea; --bg:#f6f6f9;
    --brand:#c23b4e; --ok:#2c8a5b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:20px;min-height:100vh;background:var(--bg);
    color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:760px}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .bar{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-bottom:14px;
  }
  .status{font-size:15px;font-weight:600}
  .status.ok{color:var(--ok)}
  .progress{color:var(--muted);font-size:12px;margin-top:4px;min-height:16px}
  .btns{margin-top:14px;display:flex;gap:10px}
  button{
    border:0;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--brand);color:#fff;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  #handoff{background:var(--ok)}
  .note{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7}
  .previews{display:flex;gap:14px;flex-wrap:wrap}
  .preview{
    flex:1 1 300px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:10px;
  }
  .preview h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600}
  .box{height:300px;overflow:auto;background:
    repeating-conic-gradient(#f1f1f4 0 25%,#fff 0 50%) 0 0/16px 16px;
    border-radius:8px;display:flex;align-items:center;justify-content:center}
  .box svg,.box img{max-width:100%;max-height:300px;object-fit:contain}
</style>
</head>
<body>
<div class="wrap">
  <h1>图片转 SVG（网页版）</h1>
  <div class="sub">全自动描摹 · 浏览器本地运行（无需后端）· 叠色 3D 打印版画用分层色块 SVG</div>

  <div class="bar">
    <div class="status" id="status">正在连接宿主…</div>
    <div class="progress" id="progress"></div>
    <div class="btns">
      <button id="convert" disabled>选择图片并转换</button>
      <button id="handoff" disabled>交给 Lumina 转换器</button>
    </div>
  </div>

  <div class="previews">
    <div class="preview">
      <h3>SVG 预览</h3>
      <div class="box" id="preview-svg"></div>
    </div>
    <div class="preview">
      <h3>交接用 PNG 预览</h3>
      <div class="box"><img id="preview-png" alt=""></div>
    </div>
  </div>

  <div class="note">
    全自动参数：32 色量化 · 1600px 工作网格 · 叠色分层 · 纯浏览器本地描摹，
    不使用 WebAssembly、无需后端，图片不会上传。
  </div>
</div>
